# Production stack for the VPS. Values come from .env next to this file.
#
# Locally nothing here is needed — SQLite is just a file, so `npm run dev`
# works with no containers at all.

services:
  web:
    build:
      context: .
      args:
        # both are inlined at build time — see the comments in the Dockerfile
        NEXT_PUBLIC_SITE_URL: "${SITE_URL:-http://localhost:3000}"
        ADMIN_HOST: "${ADMIN_HOST:-}"
    restart: unless-stopped
    # Bound to loopback on purpose: nginx terminates TLS and proxies here, so
    # the app must not be reachable as http://<ip>:3000 bypassing the domain.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # absolute path onto the named volume below — NOT inside the image, or
      # the database would be wiped on every rebuild
      DATABASE_URL: "file:/app/data/prod.db"
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env}"
      NEXT_PUBLIC_SITE_URL: "${SITE_URL:-http://localhost:3000}"
    volumes:
      - dbdata:/app/data
      - uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Creates/updates the database schema, then exits. Runs as the same uid as
  # the app so the file it creates stays writable by it.
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    user: "1001:1001"
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
    volumes:
      - dbdata:/app/data

  # Fills an empty database with the admin account and demo content.
  # Run manually, once: docker compose run --rm seed
  seed:
    build:
      context: .
      target: migrator
    profiles: ["manual"]
    restart: "no"
    user: "1001:1001"
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@techconnect.ru}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}"
    command: ["npx", "tsx", "prisma/seed.ts"]
    volumes:
      - dbdata:/app/data

volumes:
  dbdata:
  uploads:
